<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wicons</title>
<style>
:root{--bg:#fff;--fg:#14161a;--mut:#6b7280;--bd:#e5e7eb;--ac:#2f6bff;--chip:#f1f3f6;--chipsel:#d9e6ff}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1b;--fg:#eef0f3;--mut:#9aa1ad;--bd:#2d3036;--ac:#7fb0ff;--chip:#272829;--chipsel:#004f7c}}
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 40px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
h1{margin:0 0 2px;font-size:22px}.sub{margin:0 0 14px;color:var(--mut);font-size:13px}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--chip);color:var(--fg);font:inherit;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:0;border-radius:12px;padding:9px 14px;background:var(--chip);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--chipsel);color:var(--ac);font-weight:600}
h2{font-size:13px;margin:18px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.c{border:1px solid var(--bd);border-radius:12px;padding:12px 2px 8px;text-align:center;cursor:pointer;background:none;color:var(--fg);font:inherit}
.c svg{width:28px;height:28px;color:var(--ac)}.c span{display:block;margin-top:6px;font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;padding:0 3px}
#t{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
#t.s{opacity:1}
</style>
</head><body>
<h1>Wicons</h1><p class="sub" id="sub"></p>
<input id="q" placeholder="Search icons" autocomplete="off">
<div class="chips" id="chips"></div>
<div id="out"></div>
<div id="t"></div>

<script>
const D = {
  Actions: {
    check: '<path d="M5 12l5 5 9-10"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    edit: '<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM14.06 6.19l3.75 3.75"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    search: '<circle cx="11" cy="11" r="5"/><path d="M16 16l5 5"/>'
  },
  Social: {
    heart: '<path d="M12 21s-8.5-4.9-9.5-10C1.7 7.6 4 4 7.7 4c2 0 3.1 1 4.3 2.4C13.2 5 14.3 4 16.3 4c3.7 0 6 3.6 5.2 7-1 5.1-9.5 10-9.5 10z"/>',
    star: '<path d="M12 2l2.9 6.1L21 9.2l-5 4.7 1.5 6.8L12 2l-5.5 3.3 1.5-6.8L3 9.2l6.1-1.1L12 2z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.7-3 4.1-4.5 8-4.5s6.3 1.5 8 4.5"/>'
  },
  Travel: {
    pin: '<path d="M12 21s6-5.5 6-11a6 6 0 1 0-12 0c0 5.5 6 11 6 11zm0-9a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>',
    plane: '<path d="M2 16l20-8-20-8 4 8-4 8zm8-8l2 6"/>',
    car: '<path d="M5 16l1.5-6h11l1.5 6M7 16a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0M7 10V7a2 2 0 0 1 2-2h6l2 3v2"/>'
  }
};

const S = b => '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + b + '</svg>';
const total = Object.values(D).reduce((a, o) => a + Object.keys(o).length, 0);
document.getElementById('sub').textContent = total + ' outline icons · ' + Object.keys(D).length + ' categories · 24px · tap to copy SVG';

function toast(m) {
  const t = document.getElementById('t');
  t.textContent = m;
  t.classList.add('s');
  setTimeout(() => t.classList.remove('s'), 1200);
}

let cat = 'All';

function chips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  ['All', ...Object.keys(D)].forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === cat ? ' on' : '');
    b.textContent = (k === cat ? '✓ ' : '') + k;
    b.onclick = () => { cat = k; chips(); draw(); };
    el.appendChild(b);
  });
}

function draw() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const out = document.getElementById('out');
  out.innerHTML = '';

  for (const [k, icons] of Object.entries(D)) {
    if (cat !== 'All' && cat !== k) continue;
    const names = Object.keys(icons).filter(n => !q || n.includes(q) || k.toLowerCase().includes(q));
    if (!names.length) continue;

    const h = document.createElement('h2');
    h.textContent = k + ' · ' + names.length;
    out.appendChild(h);

    const g = document.createElement('div');
    g.className = 'g';

    names.forEach(n => {
      const b = document.createElement('button');
      b.className = 'c';
      b.innerHTML = S(icons[n]) + '<span>' + n + '</span>';
      b.onclick = async () => {
        try {
          await navigator.clipboard.writeText(S(icons[n]));
          toast('Copied wicons-' + n);
        } catch (e) {
          toast('wicons-' + n);
        }
      };
      g.appendChild(b);
    });

    out.appendChild(g);
  }
}

document.getElementById('q').oninput = draw;
chips();
draw();
</script>
</body></html>
